<html>
    <head>
        <title>Registration Form</title>
        <style>
            body{
                font-family: 'sans-serif';
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h2>User Registration Form</h2>
        <form>
            <label>Name:</label>
            <input type="text" name="name"><br>
            <label>Phone:</label>
            <input type="phone" name="phone"><br>
            <label>E-mail:</label>
            <input type="email" name="email"><br>
            <input type="button" value="submit">
        </form>
    </body>
</html>
